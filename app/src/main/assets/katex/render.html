<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js" defer></script>
<script src="contrib/auto-render.min.js" defer></script>
<style>
  /* 天光 tokens; defaults are the noon keyframe, overwritten by setTheme() from Kotlin. */
  :root {
    --text:   #141311;
    --text2:  #5F5B54;
    --accent: #B03A22;
    --line:   #E5E1D9;
    --error:  #8C1D2E;
  }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--text);
    font-family: system-ui, 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    word-wrap: break-word;
  }
  body { padding: 0 2px; }
  .katex { color: var(--text); }
  /* Block math: centred with breathing room; scrolls sideways when too wide. */
  .katex-display {
    margin: 12px 0;
    padding: 4px 0;
    overflow-x: auto;
    overflow-y: hidden;
  }
  p { margin: 0 0 10px 0; }
  p:last-child { margin-bottom: 0; }
  strong { font-weight: 600; }
  a { color: var(--accent); text-decoration: none; }
  h1, h2, h3, h4 { font-weight: 600; line-height: 1.4; margin: 14px 0 6px; }
  h1 { font-size: 18px; } h2 { font-size: 17px; } h3, h4 { font-size: 15px; }
  ul, ol { margin: 0 0 10px 0; padding-left: 1.4em; }
  li { margin: 2px 0; }
  blockquote { margin: 0 0 10px 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--text2); }
  code { color: var(--text); font-family: ui-monospace, monospace; font-size: 13px;
         padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; }
  pre { margin: 0 0 10px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  pre code { padding: 0; border: none; }
  table { border-collapse: collapse; margin: 0 0 10px 0; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  th { font-weight: 600; }
  hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
</style>
</head>
<body>
<div id="content"></div>
<script>
  var resizeObserver = null;

  // Called by MathMarkdownView whenever the 天光 palette changes.
  function setTheme(tokens) {
    var root = document.documentElement.style;
    for (var key in tokens) { root.setProperty('--' + key, tokens[key]); }
  }

  function reportHeight() {
    if (window.Android) {
      // scrollHeight reflects the final rendered content height, including any
      // overflow from math formulas. Add a tiny bottom buffer on the Kotlin side
      // so we don't clip sub-pixel descenders.
      window.Android.onRendered(document.body.scrollHeight);
    }
  }

  function setContent(html) {
    document.getElementById('content').innerHTML = html;

    var tryRender = function() {
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.getElementById('content'), {
          delimiters: [
            { left: '$$', right: '$$', display: true  },
            { left: '$',  right: '$',  display: false },
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false,
          errorColor: getComputedStyle(document.documentElement).getPropertyValue('--error').trim() || '#8C1D2E'
        });
        reportHeight();

        // KaTeX loads its math fonts asynchronously — subsequent reflows
        // need to be reported so the WebView resizes correctly.
        if (!resizeObserver && 'ResizeObserver' in window) {
          resizeObserver = new ResizeObserver(function() { reportHeight(); });
          resizeObserver.observe(document.body);
        }
        // Fallback for older WebViews: re-measure a few times after fonts
        // likely finished loading.
        setTimeout(reportHeight, 120);
        setTimeout(reportHeight, 400);
        setTimeout(reportHeight, 1200);
      } else {
        setTimeout(tryRender, 30);
      }
    };
    tryRender();
  }
</script>
</body>
</html>
