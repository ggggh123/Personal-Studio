<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js" defer></script>
<script src="contrib/auto-render.min.js" defer></script>
<style>
  /* 天光 tokens; defaults are the noon keyframe, overwritten by setTheme() from Kotlin. */
  :root {
    --text:   #141311;
    --text2:  #5F5B54;
    --accent: #B03A22;
    --line:   #E5E1D9;
    --error:  #8C1D2E;
  }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--text);
    font-family: system-ui, 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    word-wrap: break-word;
  }
  body { padding: 0 2px; }
  .katex { color: var(--text); }
  .katex .mop { color: var(--accent); }
  /* Block math: extra vertical room and a hairline on the left */
  .katex-display {
    margin: 10px 0;
    padding: 6px 10px;
    border-left: 2px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
  }
  p { margin: 0 0 10px 0; }
  code { color: var(--text2); }
</style>
</head>
<body>
<div id="content"></div>
<script>
  var resizeObserver = null;

  // Called by MathMarkdownView whenever the 天光 palette changes.
  function setTheme(tokens) {
    var root = document.documentElement.style;
    for (var key in tokens) { root.setProperty('--' + key, tokens[key]); }
  }

  function reportHeight() {
    if (window.Android) {
      // scrollHeight reflects the final rendered content height, including any
      // overflow from math formulas. Add a tiny bottom buffer on the Kotlin side
      // so we don't clip sub-pixel descenders.
      window.Android.onRendered(document.body.scrollHeight);
    }
  }

  function setContent(html) {
    document.getElementById('content').innerHTML = html;

    var tryRender = function() {
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.getElementById('content'), {
          delimiters: [
            { left: '$$', right: '$$', display: true  },
            { left: '$',  right: '$',  display: false },
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false,
          errorColor: getComputedStyle(document.documentElement).getPropertyValue('--error').trim() || '#8C1D2E'
        });
        reportHeight();

        // KaTeX loads its math fonts asynchronously — subsequent reflows
        // need to be reported so the WebView resizes correctly.
        if (!resizeObserver && 'ResizeObserver' in window) {
          resizeObserver = new ResizeObserver(function() { reportHeight(); });
          resizeObserver.observe(document.body);
        }
        // Fallback for older WebViews: re-measure a few times after fonts
        // likely finished loading.
        setTimeout(reportHeight, 120);
        setTimeout(reportHeight, 400);
        setTimeout(reportHeight, 1200);
      } else {
        setTimeout(tryRender, 30);
      }
    };
    tryRender();
  }
</script>
</body>
</html>
